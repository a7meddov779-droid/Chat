<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نظام الدردشة</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <h1>💬 نظام الدردشة</h1>
        
        <div class="nav">
            <button onclick="showSection('create')">➕ إنشاء مستخدم</button>
            <button onclick="showSection('users')">👥 المستخدمين</button>
            <button onclick="showSection('send')">✉️ إرسال رسالة</button>
            <button onclick="showSection('messages')">📭 رسائلي</button>
            <button onclick="showSection('stats')">📊 الإحصائيات</button>
        </div>

        <!-- قسم إنشاء مستخدم -->
        <div id="create" class="section">
            <h2>➕ إنشاء مستخدم جديد</h2>
            <input type="text" id="userName" placeholder="الاسم الكامل" />
            <button onclick="createUser()">إنشاء</button>
            <div id="createResult"></div>
        </div>

        <!-- قسم عرض المستخدمين -->
        <div id="users" class="section" style="display:none;">
            <h2>👥 قائمة المستخدمين</h2>
            <button onclick="loadUsers()">تحديث</button>
            <div id="usersResult"></div>
        </div>

        <!-- قسم إرسال رسالة -->
        <div id="send" class="section" style="display:none;">
            <h2>✉️ إرسال رسالة</h2>
            <input type="text" id="fromId" placeholder="معرفك (8 أرقام)" />
            <input type="text" id="toId" placeholder="معرف المستقبل (8 أرقام)" />
            <textarea id="msgText" placeholder="نص الرسالة"></textarea>
            <button onclick="sendMessage()">إرسال</button>
            <div id="sendResult"></div>
        </div>

        <!-- قسم عرض الرسائل -->
        <div id="messages" class="section" style="display:none;">
            <h2>📭 رسائلي</h2>
            <input type="text" id="myId" placeholder="معرفك (8 أرقام)" />
            <button onclick="loadMessages()">عرض الرسائل</button>
            <div id="messagesResult"></div>
        </div>

        <!-- قسم الإحصائيات -->
        <div id="stats" class="section" style="display:none;">
            <h2>📊 المستخدمون النشطون</h2>
            <button onclick="loadStats()">تحديث</button>
            <div id="statsResult"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
